# Invalid: stream=bidi + http.enable=true (grpc-gateway does not support bidirectional-streaming)
syntax: v1
name: test.invalid
import_protos:
  - path: "proto/**/*.proto"
  - git: https://github.com/googleapis/googleapis
    ref: master
settings:
  go_repo: github.com/test/repo
  out:
    proto: generated/proto
    go: generated/go
  http:
    enable: true
entities:
  - name: foo
    key:
      type_: FooId
    resources:
      - name: bar
        type_: Bar
        version: { kind: NONE }
        reader: {}
services:
  - name: FooService
    entities:
      - name: foo
    custom_methods:
      - name: ChatBars
        request: Bar
        response: Meta
        stream: bidi
