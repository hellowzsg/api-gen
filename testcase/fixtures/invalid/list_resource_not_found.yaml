# E4: entity.list.resource references a resource not declared in the entity
syntax: v1
name: test.list_resource_not_found
import_protos:
  - path: "proto/**/*.proto"
entities:
  - name: foo
    key:
      type_: FooId
    list:
      resource: [nonexistent]
    resources:
      - name: bar
        type_: Bar
        version: { kind: NONE }
services:
  - name: FooService
    entities:
      - name: foo
