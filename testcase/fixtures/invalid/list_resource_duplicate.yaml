# E6: entity.list.resource has duplicate entries — must fail-fast
syntax: v1
name: test.list_resource_duplicate
import_protos:
  - path: "proto/**/*.proto"
entities:
  - name: foo
    key:
      type_: FooId
    list:
      resource: [bar, bar]
    resources:
      - name: bar
        type_: Bar
        version: { kind: NONE }
services:
  - name: FooService
    entities:
      - name: foo
